<!DOCTYPE html>
<html>
<head>
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
</head>
<body>
    <small>Ad</small>
    <div class="row">
        <img src="/images/gayflag.png" width="26px" height="26px">
        <div>
            <h4>Are you Gay?</h4>
            <p>https://thegaytest.com</p>
        </div>
    </div>
    <p>Lets see how gay are you?</p>
    <button>Take quiz now!</button>



    <style>


        html {
            margin:8px;
        }

        body, h3, h1, h2, h4, h5, p{
            line-height: 1.1;
            margin: 0 !important;
            margin-block-start: 0;
            padding: 0;
            background-color: white;
            font-family: "Google Sans", sans-serif;
        }

        body > p {
            font-size: 0.8em;
        }


        .row {
                display: flex;
                padding: 0;
                overflow: hidden;
                align-items: center;
                line-height: 0px;
                margin-bottom: 4px;
        }

        .row > div > p {
            line-height: 1.5;
            color: gray;
            font-size: 0.7em;
        }

        img {margin-right: 12px;}
        button { margin-top: 4px; background-color: rgb(224, 224, 224); border: solid 1px rgb(184, 184, 184);}
        button:hover{background-color: white;}
    </style>
</body>
</html>
